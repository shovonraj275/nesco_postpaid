<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nesco</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="./src/css/style.css">
</head>

<body>
    <section id="header">
        <div class="grid">
            <div class="grid-content">
                <img src="./src/img/3e765f1c1adc4993b8a72b8a4ce87b7b (1).png" alt="Nesc Logo">
            </div>
            <div class="grid-content">
                <h1>নর্দান ইলেকট্রিসিটি সাপ্লাই পিএলসি</h1>
            </div>
        </div>
    </section>
    <section id="Marque">
        <h1>
            <marquee behavior="" direction="">নর্দান ইলেকট্রিসিটি সাপ্লাই পিএলসি আপনাকে স্বাগতম জানাচ্ছে। আমরা আপনার
                জন্য সর্বোত্তম সেবা প্রদান করতে প্রতিশ্রুতিবদ্ধ। আমাদের সাথে থাকুন আমাদের সেবার সুবিধা গ্রহণ করুন এবং
                আপনার বিদ্যুৎ বিল পরিশোধ করুন। ধন্যবাদ!
            </marquee>
        </h1>
    </section>
    <section>
        <h2>আপনার বিদ্যুৎ বিল হিসাব করুন</h2>
    </section>
    <section id="count">
        <div class="grid">
            <div class="grid-content">
                <label for="consumption">বিদ্যুৎ ব্যবহার (কিলোওয়াট)</label> <br>
                <input type="number" value="610" id="consumption" name="consumption"
                    placeholder="আপনার বিদ্যুৎ ব্যবহার লিখুন">
            </div>
            <div class="grid-content">
                <label for="load">অনুমোদিত লোড (কিলোওয়াট)</label> <br>
                <input type="number" value="2" id="load" name="load" placeholder="অনুমোদিত (কিলোওয়াট) লিখুন">
            </div>
            <div class="grid-content">
                <button onclick="count()">হিসাব করুন</button>
            </div>
        </div>
    </section>
    <div id="output">

    </div>
    <div id="output2">

    </div>


    <script src="./src/js/main.js"></script>
</body>

</html>
