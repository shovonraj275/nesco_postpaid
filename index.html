<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nesco</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="./src/css/style.css" />
  </head>

  <body>
    <section id="header">
      <div class="grid">
        <div class="grid-content">
          <img
            src="./src/img/3e765f1c1adc4993b8a72b8a4ce87b7b (1).png"
            alt="Nesc Logo"
          />
        </div>
        <div class="grid-content">
          <h1 id="name">নর্দান ইলেকট্রিসিটি সাপ্লাই পিএলসি</h1>
        </div>
      </div>
    </section>
    <section id="Marque">
      <h1>
        <marquee behavior="" direction="">
          নর্দান ইলেকট্রিসিটি সাপ্লাই পিএলসি আপনাকে স্বাগতম জানাচ্ছে। আমরা আপনার
          জন্য সর্বোত্তম সেবা প্রদান করতে প্রতিশ্রুতিবদ্ধ। আমাদের সাথে থাকুন
          আমাদের সেবার সুবিধা গ্রহণ করুন এবং আপনার বিদ্যুৎ বিল পরিশোধ করুন।
          ধন্যবাদ!
        </marquee>
      </h1>
    </section>
    <div id="time"></div>
    <div class="btn_section_1">
        <button onclick="gridout()" class="btn btn_active">
          গ্রিড লাইনের বিল হিসাব করুন 
        </button>
        <button onclick="solorOutput()" class="btn">
          সোলার লাইনের বিল হিসাব করুন 
        </button>
    </div>
    <div id="gridss" class="grid_content">
      <section id="count">
        <div class="grid">
          <div class="grid-content">
            <label for="consumption">বিদ্যুৎ ব্যবহার (কিলোওয়াট)</label>
            <br />
            <input
              type="number"
              id="consumption"
              name="consumption"
              placeholder="আপনার বিদ্যুৎ ব্যবহার লিখুন"
            />
          </div>
          <div class="grid-content">
            <label for="load">অনুমোদিত লোড (কিলোওয়াট)</label> <br />
            <input
              type="number"
              id="load"
              name="load"
              placeholder="অনুমোদিত (কিলোওয়াট) লিখুন"
            />
          </div>
          <div class="grid-content">
            <button class="btn_001" onclick="count()">হিসাব করুন</button>
          </div>
        </div>
      </section>
    </div>
    <div id="solar" class="grid_content">
      <section id="count_02">
        <div class="solor_grid">
          <div class="grid-content">
            <label for="consumption" >বিদ্যুৎ ব্যবহার (কিলোওয়াট)</label>
            <br />
            <input
              type="number" id="consumption_solor_sourse" name="consumption" placeholder="আপনার বিদ্যুৎ ব্যবহার লিখুন"
            />
          </div>
          <div class="grid-content">
            <label for="consumption">আপনার সোলার ব্যবহার (কিলোওয়াট)</label>
            
            
            <input
              type="number" id="consumption_solor_solor" name="consumption"placeholder="আপনার সোলার ব্যবহার লিখুন"
            />
          </div>
          <div class="grid-content">
            <label for="load">অনুমোদিত লোড (কিলোওয়াট)</label> <br />
            <input
              type="number" id="load_solor" name="load"  placeholder="অনুমোদিত (কিলোওয়াট) লিখুন"
            />
          </div>
          <div class="grid-content">
            <button class="btn_001" onclick="count_02()">হিসাব করুন</button>
          </div>
        </div>
      </section>
    </div>
    <div id="output_grid"></div>
    <div id="output_solor"></div>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="./src/js/main.js"></script>
  </body>
</html>
