<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Div Content</title>
</head>
<body style="text-align:center;">
    <div id="GFG" style="background-color: green; padding: 20px;">
        <h2>GeeksforGeeks</h2>
        <p>This content inside the div will be printed when you click the button.
             
        </p>
    </div>
    <input type="button" value="Print Div" onclick="printDiv()">
<script>
        function printDiv() {
            let divContents = document.getElementById("GFG").innerHTML;
            let printWindow = window.open('', '', 'height=500, width=500');
            printWindow.document.open();
            printWindow.document.write(`
                <html>
                <head>
                    <title>Print Div Content</title>
                    <style>
                        body { font-family: Arial, sans-serif; }
                        h1 { color: #333; }
                    </style>
                </head>
                <body>
                    <h1>Div Contents:</h1>
                    ${divContents}
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }
    </script>
</body>
</html>
